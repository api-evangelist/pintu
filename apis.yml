apis:
- name: Pintu Pro Partner API
  description: >-
    Pintu Pro's institutional/partner trading API. A unified message format is
    used over both an HTTP endpoint and a WebSocket transport, authenticated
    with an HMAC-SHA256 signature computed from an API key and secret. Partners
    place and cancel market/limit orders and subscribe to public and private
    streaming channels (ExecutionReport / Trade / user.orders) for order and
    trade updates, with a weighted per-second token rate limiter.
  humanURL: https://docs.pintu.pro/
