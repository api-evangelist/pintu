aid: pintu
name: Pintu
description: >-
  Pintu (PT Pintu Kemana Saja) is an Indonesian cryptocurrency exchange and
  investment app founded in April 2020 and headquartered in Jakarta. Licensed as
  a Physical Crypto Asset Trader (PFAK) under Bappebti and now supervised by the
  OJK, Pintu serves more than four million retail users with spot trading,
  crypto futures, staking/Earn, and a self-custody Web3 wallet connecting to
  DeFi and NFT dApps. Beyond the consumer app, Pintu operates Pintu Pro, an
  institutional and partner trading platform whose HMAC-signed WebSocket + HTTP
  API (docs.pintu.pro) lets market makers and partners place and cancel orders
  and stream execution reports and trades against production and sandbox
  environments. Pintu has raised over 150M USD across a Lightspeed-led 35M
  Series A+ (2021) and a 113M Series B (2022) with Intudo, Pantera Capital, and
  Northstar.
